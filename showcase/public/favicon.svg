<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d31d13"/>
      <stop offset="1" stop-color="#9c0f08"/>
    </linearGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37302c"/>
      <stop offset="1" stop-color="#1e1916"/>
    </linearGradient>
  </defs>
  <!-- red chassis -->
  <rect x="3" y="6" width="58" height="52" rx="13" fill="url(#body)"/>
  <rect x="6" y="9" width="52" height="15" rx="7.5" fill="#ffffff" opacity=".14"/>
  <!-- knobs -->
  <g fill="#38201d">
    <circle cx="15" cy="21" r="5.5"/>
    <circle cx="32" cy="21" r="5.5"/>
    <circle cx="49" cy="21" r="5.5"/>
  </g>
  <g stroke="#ffe9dd" stroke-width="2" stroke-linecap="round">
    <line x1="15" y1="21" x2="12.2" y2="17.9"/>
    <line x1="32" y1="21" x2="32" y2="16.8"/>
    <line x1="49" y1="21" x2="51.8" y2="17.9"/>
  </g>
  <!-- keybed: one octave C-B, real key geometry scaled to 48px -->
  <rect x="8" y="33.5" width="48" height="19.5" rx="4.5" fill="#6f0a05" opacity=".6"/>
  <rect x="8" y="32" width="48" height="19.5" rx="4.5" fill="#fff8ec"/>
  <!-- white-key separators (full height at E/F; below the blacks elsewhere) -->
  <g fill="#e6d8c4">
    <rect x="14.36" y="45" width="1" height="5.5"/>
    <rect x="21.21" y="45" width="1" height="5.5"/>
    <rect x="28.07" y="33.8" width="1" height="16.7"/>
    <rect x="34.93" y="45" width="1" height="5.5"/>
    <rect x="41.79" y="45" width="1" height="5.5"/>
    <rect x="48.64" y="45" width="1" height="5.5"/>
  </g>
  <!-- black keys, bottom corners rounded -->
  <g fill="url(#bk)">
    <path d="M12.06 32h4.2v11a1.5 1.5 0 0 1-1.5 1.5h-1.2a1.5 1.5 0 0 1-1.5-1.5z"/>
    <path d="M20.31 32h4.2v11a1.5 1.5 0 0 1-1.5 1.5h-1.2a1.5 1.5 0 0 1-1.5-1.5z"/>
    <path d="M32.28 32h4.2v11a1.5 1.5 0 0 1-1.5 1.5h-1.2a1.5 1.5 0 0 1-1.5-1.5z"/>
    <path d="M40.19 32h4.2v11a1.5 1.5 0 0 1-1.5 1.5h-1.2a1.5 1.5 0 0 1-1.5-1.5z"/>
    <path d="M48.09 32h4.2v11a1.5 1.5 0 0 1-1.5 1.5h-1.2a1.5 1.5 0 0 1-1.5-1.5z"/>
  </g>
</svg>
